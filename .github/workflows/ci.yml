name: CI

# Mirrors macss/.github/workflows/ci.yml, minus the path filter and
# working-directory that exist there because macss is a monorepo.
#
# Two systems rather than three: macOS is deferred by decision, recorded with
# the specification for issue #15. The ecosystem's own precedent does not cover
# it either.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: modular_cli_sdk

    steps:
      # Checked out into a named directory so that preview_executor can sit
      # beside it, which is where pubspec.yaml's dependency_overrides looks.
      - uses: actions/checkout@v4
        with:
          path: modular_cli_sdk

      # The engine is not on pub.dev yet, so it is resolved from source. This
      # step and the override in pubspec.yaml go together, and both go away the
      # day preview_executor is published.
      - uses: actions/checkout@v4
        with:
          repository: ccisnedev/preview_executor
          path: preview_executor

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: dart pub get
        run: dart pub get

      - name: dart analyze
        run: dart analyze --fatal-infos

      # Includes test/running_from_source_test.dart, which compiles executables
      # and is therefore slower than the rest of the suite put together. It is
      # what demonstrates, on both systems, that a dev build answers as the
      # installed CLI does and running from source does not.
      - name: dart test
        run: dart test
