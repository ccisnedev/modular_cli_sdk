name: CI

# Mirrors macss/.github/workflows/ci.yml, minus the path filter and
# working-directory that exist there because macss is a monorepo.
#
# Two systems rather than three: macOS is deferred by decision, recorded with
# the specification for issue #15. The ecosystem's own precedent does not cover
# it either.

on:
  push:
    branches: [main]
  # No branches filter here: a pull request into any base branch runs CI, not
  # only one whose base happens to be main. A feature branch stacked on
  # another feature branch (its own base not yet merged to main) still gets
  # CI on every PR into it.
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: dart pub get
        run: dart pub get

      - name: dart analyze
        run: dart analyze --fatal-infos

      # Includes test/running_from_source_test.dart, which compiles executables
      # and is therefore slower than the rest of the suite put together. It is
      # what demonstrates, on both systems, that a dev build answers as the
      # installed CLI does and running from source does not.
      - name: dart test
        run: dart test
